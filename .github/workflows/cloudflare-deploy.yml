name: Cloudflare Pages Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

# Cancel in-progress deployments for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.cf.outputs.configured }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Check Cloudflare credentials
        id: cf
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Pages skipped: secrets not configured. Production stays on Vercel (gray-cloud DNS)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.cf.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.cf.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache Next.js build
        if: steps.cf.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        if: steps.cf.outputs.configured == 'true'
        run: npm ci

      - name: Use npm for @cloudflare/next-on-pages
        if: steps.cf.outputs.configured == 'true'
        run: rm -f pnpm-lock.yaml

      - name: Build for Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        run: npm run build:cloudflare
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_REALSCOUT_AGENT_ID: ${{ secrets.NEXT_PUBLIC_REALSCOUT_AGENT_ID }}

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=heyberkshire-com --branch=${{ github.ref_name }}

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request' && steps.cf.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const deploymentUrl = `https://${branch}.heyberkshire-com.pages.dev`;

            const comment = `## 🚀 Cloudflare Pages Deployment

            ✅ **Preview URL:** ${deploymentUrl}

            ### Quick Links
            - 📱 [Mobile Test](https://mobilemoxie.com/tools/mobile-test/?url=${deploymentUrl})
            - 🔍 [Page Speed](https://pagespeed.web.dev/analysis?url=${deploymentUrl})
            - ♿ [Accessibility](https://wave.webaim.org/report#/${deploymentUrl})

            ---
            *Deployed with Cloudflare Pages • Commit: ${context.sha.substring(0, 7)}*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.deploy.outputs.configured == 'true'
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

  performance-audit:
    name: Cloudflare Performance Audit
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'pull_request' && needs.deploy.outputs.configured == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://${{ github.event.pull_request.head.ref }}.heyberkshire-com.pages.dev
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment PR with Performance Results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');

            let comment = `## 📊 Cloudflare Pages Performance Report\n\n`;
            comment += `Lighthouse audit completed for Cloudflare deployment.\n\n`;
            comment += `View detailed results in Actions artifacts.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
